###############################################################################
# NGINX SERVER BLOCK — paymentapi.bellsuniversity.edu.ng
# Reverse proxy -> 127.0.0.1:3001 (Node.js / Express running via PM2)
#
# INSTALL: sudo cp /var/www/bells-payment/nginx/paymentapi.bellsuniversity.edu.ng.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/paymentapi.bellsuniversity.edu.ng.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d paymentapi.bellsuniversity.edu.ng   (first time only)
###############################################################################

server {
    listen 80;
    listen [::]:80;
    server_name paymentapi.bellsuniversity.edu.ng;

    # return 301 https://$host$request_uri;    # (certbot uncomments)

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/_letsencrypt;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paymentapi.bellsuniversity.edu.ng;

    # ssl_certificate     /etc/letsencrypt/live/paymentapi.bellsuniversity.edu.ng/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/paymentapi.bellsuniversity.edu.ng/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_BELLS_API:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "DENY"              always;
    add_header Referrer-Policy           "strict-origin"     always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # ---------------------------------------------------------------------------
    # NOTE (documentation only — no functional nginx change in this block):
    # The Express backend (api/src/app.ts) HELMET emits Content-Security-Policy
    # headers including these origins for ALATPay native popup mode:
    #   script-src  https://web.alatpay.ng https://alatpay-client.azurewebsites.net
    #   frame-src   https://web.alatpay.ng https://alatpay-client.azurewebsites.net
    #   child-src   https://web.alatpay.ng https://alatpay-client.azurewebsites.net
    #   connect-src https://alatpay.azure-api.net
    # This is a REVERSE PROXY ONLY — it is the payment.bellsuniversity.edu.ng
    # frontend that actually needs CSP for ALATPay SDK loading (see sibling
    # payment.bellsuniversity.edu.ng.conf file for the authoritative proposed
    # CSP augmentation block — requires SEPARATE DEPLOYMENT PHASE authorization
    # before being applied live).
    # ---------------------------------------------------------------------------

    access_log /var/log/nginx/paymentapi.bellsuniversity.edu.ng-access.log;
    error_log  /var/log/nginx/paymentapi.bellsuniversity.edu.ng-error.log  warn;

    # === Reverse proxy -> Express on localhost:3001 =========================
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # === Webhook / PDF download timeouts — Paystack needs time to call back
        proxy_connect_timeout   30s;
        proxy_send_timeout     120s;   # Puppeteer PDF watermarks + receipt generation
        proxy_read_timeout     120s;

        # Forward real client data to Express (Helmet + Express rate limit need real IPs)
        proxy_set_header Host                 $host;
        proxy_set_header X-Real-IP            $remote_addr;
        proxy_set_header X-Forwarded-For      $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto    $scheme;
        proxy_set_header X-Forwarded-Host     $host;
        proxy_set_header X-Forwarded-Port     $server_port;

        # 50MB body limit — Bulk CSV/XLSX Student/Fee Catalogue uploads
        # formidable in src/middlewares upload controller uses this
        client_max_body_size 50M;
        client_body_timeout  120s;

        # Do not buffer large receipt downloads / CSV exports
        proxy_buffering off;
        proxy_cache off;

        # Disable upstream redirect rewrite (we send 3xx carefully from Express)
        proxy_redirect off;
    }

    # === Explicit /health endpoint ==========================================
    # Bypasses extra processing; good for UptimeRobot/cron
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3001/api/v1/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
        expires 10s;
        add_header Cache-Control "public, max-age=10";
    }

    # === Hide hidden files ==================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
