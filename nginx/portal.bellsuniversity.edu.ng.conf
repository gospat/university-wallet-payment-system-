###############################################################################
# NGINX SERVER BLOCK — portal.bellsuniversity.edu.ng
# React SPA (STATIC files built with Vite, served from deploy.sh rsync target)
#
# INSTALL: sudo cp /var/www/bells-payment/nginx/portal.bellsuniversity.edu.ng.conf /etc/nginx/sites-available/
#          sudo ln -s /etc/nginx/sites-available/portal.bellsuniversity.edu.ng.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d portal.bellsuniversity.edu.ng   (first time only)
###############################################################################

server {
    listen 80;
    listen [::]:80;
    server_name portal.bellsuniversity.edu.ng;

    # Let certbot handle HTTP -> HTTPS redirect (auto-added). If not using certbot, uncomment:
    # return 301 https://$host$request_uri;

    # ACME Challenge document root for certbot http-01
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/_letsencrypt;
    }
}

# After certbot runs, this server block is augmented with the 443 ssl block
# automatically. Below is what the SSL version looks like.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.bellsuniversity.edu.ng;

    # === SSL settings (certbot fills these paths) ===========================
    # ssl_certificate     /etc/letsencrypt/live/portal.bellsuniversity.edu.ng/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/portal.bellsuniversity.edu.ng/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL_BELLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # === HSTS (HTTPS-only after certbot, keep 1 year with includeSubDomains) ==
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "DENY"              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' https://api.bellsuniversity.edu.ng; frame-ancestors 'none'; form-action 'self';" always;

    # === Logging =============================================================
    access_log /var/log/nginx/portal.bellsuniversity.edu.ng-access.log;
    error_log  /var/log/nginx/portal.bellsuniversity.edu.ng-error.log  warn;

    # === Gzip + Brotli for SPA assets (cuts wire size ~70%) ==================
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/json application/javascript application/ld+json application/manifest+json
        application/xml+rss application/xhtml+xml
        font/otf font/ttf font/woff2 image/svg+xml;
    gzip_vary on;
    gzip_disable "msie6";

    root /var/www/portal.bellsuniversity.edu.ng/html;
    index index.html;

    # === Long-term cache for hashed Vite assets (never changes, immutable) ===
    # Vite emits assets/assets/index-[hash].js, /assets/vendor-[hash].css etc.
    location ~* ^/assets/ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # === Short cache for static branding assets (bells crest, favicon) ======
    location ~* \.(?:png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|otf|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # robots.txt / humans.txt — short cache
    location = /robots.txt   { expires 1h; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }
    location = /humans.txt   { expires 1h; add_header Cache-Control "public, max-age=3600"; try_files $uri =404; }

    # === SPA FALLBACK — React Router handles /admin/login, /student/dashboard etc.
    # Without this, deep-linking to any / route returns 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Hide hidden files (security — never leak .env, .git etc.) ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
