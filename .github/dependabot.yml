version: 2
updates:
  # API package (Express + Prisma + TypeScript)
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      api-npm:
        patterns:
          - "*"

  # Frontend package (React + Vite + TypeScript)
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      app-npm:
        patterns:
          - "*"

  # Keep the workflow actions (checkout, setup-node, codeql-action, ...) patched
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
