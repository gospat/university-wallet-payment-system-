name: Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege for the workflow token.
permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Lint API
        working-directory: api
        run: npx eslint . --max-warnings 0

      - name: Type-check API
        working-directory: api
        run: npx tsc --noEmit

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Test API
        working-directory: api
        run: npx jest --silent --passWithNoTests

      - name: Security tests (API)
        working-directory: api
        run: npx jest --silent --passWithNoTests "security|auth-token-hardening|rbac|ssrf|receipt-ssrf"

      - name: Audit API production dependencies
        working-directory: api
        run: npm audit --omit=dev --audit-level=high

  build-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install App dependencies
        working-directory: app
        run: npm ci

      - name: Lint App
        working-directory: app
        run: npx eslint . --max-warnings 0

      - name: Type-check App
        working-directory: app
        run: npx tsc --noEmit

      - name: Test App
        working-directory: app
        run: npm run test

      - name: Build App
        working-directory: app
        run: npm run build

      - name: Audit App production dependencies
        working-directory: app
        run: npm audit --omit=dev --audit-level=high
